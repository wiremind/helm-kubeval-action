on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Helm Kubeval Action test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: helm kubeval
        uses: ./ # Uses an action in the root directory
        with:
          path: 'test/charts'
