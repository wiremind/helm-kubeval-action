on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Helm Kubeval Action test
    steps:
      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - name: helm kubeval
        uses: ./ # Uses an action in the root directory
        with:
          path: 'test/charts'
